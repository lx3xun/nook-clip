[workspace]
members = [
    "crates/nookclip-core",
    "crates/nookclip-ffi",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["lx3xun"]
license = "GPL-3.0-only"

[workspace.dependencies]
rusqlite = { version = "0.31", features = ["bundled-full"] }
aes-gcm = "0.10"
regex = "1.10"
parking_lot = "0.12"
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4"] }
uniffi = { version = "0.28" }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rmp-serde = "1.3"
zstd = "0.13"
sha2 = "0.10"
ureq = { version = "2.10", default-features = false, features = ["tls"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
