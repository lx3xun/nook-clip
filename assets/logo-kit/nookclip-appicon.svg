<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg-tile" x1="200" y1="100" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="blue-pillar" x1="600" y1="300" x2="750" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#388BFD"/>
      <stop offset="1" stop-color="#1677FF"/>
    </linearGradient>
    <filter id="shadow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- macOS Squircle Background -->
  <rect x="64" y="64" width="896" height="896" rx="220" fill="url(#bg-tile)"/>
  
  <!-- Nook Card Container with Shadow -->
  <g filter="url(#shadow-card)">
    <rect x="256" y="216" width="512" height="592" rx="96" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="8"/>
    <!-- Left Column (Clipboard History Stash) -->
    <rect x="344" y="312" width="76" height="392" rx="38" fill="#94A3B8"/>
    <!-- 45° Origami Diagonal Fold (Notes & Transition) -->
    <path d="M 420 352 L 604 536 L 604 600 L 420 416 Z" fill="#CBD5E1"/>
    <!-- Right Column (Signature Electric Blue Action Pill) -->
    <rect x="604" y="312" width="76" height="392" rx="38" fill="url(#blue-pillar)"/>
    <!-- Spark / Action Indicator Dot -->
    <circle cx="642" cy="360" r="16" fill="#FFFFFF"/>
  </g>
</svg>