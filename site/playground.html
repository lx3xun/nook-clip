<!DOCTYPE html>
<html lang="zh-Hans" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NookClip - 在线全屏交互原型测试台</title>
  <meta name="description" content="NookClip 剪贴板管理工具在线交互测试台。100% 复刻 macOS 原生面板界面，支持全键盘主循环操作、各类数据预览与深浅色模式。">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="style.css?v=20261023">
  <link rel="stylesheet" href="prototype.css?v=20261023">
  <style>
    /* 全屏 macOS 桌面模拟环境 */
    body.macos-desktop {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: var(--nook-font-sans);
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 60%, #020617 100%);
      display: flex;
      flex-direction: column;
      user-select: none;
      transition: background 0.3s ease;
    }

    body.macos-desktop.is-light {
      background: radial-gradient(circle at 50% 30%, #e2e8f0 0%, #cbd5e1 60%, #94a3b8 100%);
    }

    /* 顶部 macOS 菜单栏 */
    .macos-menubar {
      height: 28px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 0.5px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.88);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 13px;
      font-weight: 500;
      z-index: 1000;
      flex-shrink: 0;
    }

    body.macos-desktop.is-light .macos-menubar {
      background: rgba(255, 255, 255, 0.75);
      border-bottom: 0.5px solid rgba(0, 0, 0, 0.12);
      color: rgba(0, 0, 0, 0.88);
    }

    .macos-menu-left, .macos-menu-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .macos-apple-logo {
      font-size: 15px;
      cursor: pointer;
    }

    .macos-menu-item {
      cursor: pointer;
      font-size: 13px;
      transition: opacity 0.15s ease;
    }

    .macos-menu-item:hover {
      opacity: 0.7;
    }

    .macos-menu-bold {
      font-weight: 600;
    }

    /* 桌面工作区 */
    .macos-workspace {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* 桌面顶部悬浮控制栏 */
    .desktop-floating-hud {
      position: absolute;
      top: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(26, 26, 29, 0.85);
      backdrop-filter: blur(20px);
      padding: 6px 14px;
      border-radius: 9999px;
      border: 0.5px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 12px;
      z-index: 100;
    }

    body.macos-desktop.is-light .desktop-floating-hud {
      background: rgba(255, 255, 255, 0.85);
      border: 0.5px solid rgba(0, 0, 0, 0.12);
      color: #1d1d1f;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    .desktop-hud-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .desktop-hud-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #30D158;
      box-shadow: 0 0 6px #30D158;
    }

    .desktop-hud-btn {
      padding: 3px 10px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: inherit;
      font-size: 11px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .desktop-hud-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    /* 底部快捷键提示常驻胶囊 */
    .desktop-bottom-cheatsheet {
      position: absolute;
      bottom: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      padding: 6px 18px;
      border-radius: 9999px;
      border: 0.5px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.75);
      font-size: 11px;
      z-index: 100;
      flex-wrap: wrap;
      justify-content: center;
    }

    body.macos-desktop.is-light .desktop-bottom-cheatsheet {
      background: rgba(255, 255, 255, 0.75);
      border: 0.5px solid rgba(0, 0, 0, 0.1);
      color: rgba(60, 60, 67, 0.85);
    }

    .cheatsheet-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body class="macos-desktop" id="desktopBody">
  <!-- macOS 顶部菜单栏 -->
  <header class="macos-menubar" role="banner">
    <div class="macos-menu-left">
      <span class="macos-apple-logo"></span>
      <span class="macos-menu-item macos-menu-bold">NookClip</span>
      <span class="macos-menu-item">编辑</span>
      <span class="macos-menu-item">视图</span>
      <span class="macos-menu-item">历史</span>
      <span class="macos-menu-item">窗口</span>
      <span class="macos-menu-item">帮助</span>
    </div>
    <div class="macos-menu-right">
      <span class="macos-menu-item" title="NookClip 常驻菜单栏图标">
        <svg width="15" height="15" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;">
          <rect x="3" y="2" width="16" height="18" rx="3.5"/>
          <path d="M 7.5 15.5 L 7.5 6.5 L 14.5 15.5 L 14.5 6.5"/>
        </svg>
      </span>
      <span class="macos-menu-item">拼音</span>
      <span class="macos-menu-item" id="desktopClock">周五 10:24</span>
    </div>
  </header>

  <!-- 桌面工作区 -->
  <main class="macos-workspace" id="workspace">
    <!-- 顶部控制小岛 -->
    <div class="desktop-floating-hud">
      <span class="desktop-hud-tag"><span class="desktop-hud-dot"></span> 全功能测试台已就绪</span>
      <span style="opacity:0.4;">|</span>
      <button type="button" class="desktop-hud-btn" id="themeBtn">🌓 <span id="themeBtnText">切换浅色</span></button>
      <button type="button" class="desktop-hud-btn" id="resetBtn">↺ 重置数据</button>
      <a href="index.html" class="desktop-hud-btn">← 返回官网首页</a>
    </div>

    <!-- 挂载 NookClip 原型容器 -->
    <div id="standalonePrototypeMount" style="width: 100%; max-width: 820px; display: flex; justify-content: center;"></div>

    <!-- 底部快捷键全局提示条 -->
    <footer class="desktop-bottom-cheatsheet" aria-label="快捷键速查条">
      <span class="cheatsheet-item"><span class="nook-kbd">↑</span><span class="nook-kbd">↓</span> 移动选择</span>
      <span class="cheatsheet-item"><span class="nook-kbd">⏎</span> 模拟粘贴</span>
      <span class="cheatsheet-item"><span class="nook-kbd">⌥⏎</span> 纯文本粘贴</span>
      <span class="cheatsheet-item"><span class="nook-kbd">⌘[</span><span class="nook-kbd">⌘]</span> 切换分类</span>
      <span class="cheatsheet-item"><span class="nook-kbd">⌘F</span> 聚焦搜索</span>
      <span class="cheatsheet-item"><span class="nook-kbd">⌘S</span> 收藏</span>
      <span class="cheatsheet-item"><span class="nook-kbd">⌘R</span> 别名</span>
      <span class="cheatsheet-item"><span class="nook-kbd">⌘⌫</span> 删除</span>
      <span class="cheatsheet-item"><span class="nook-kbd">⌘Z</span> 撤销</span>
      <span class="cheatsheet-item"><span class="nook-kbd">Esc</span> 清空/复位</span>
    </footer>
  </main>

  <script src="prototype.js?v=20261023"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const desktop = document.getElementById('desktopBody');
      const themeBtn = document.getElementById('themeBtn');
      const themeBtnText = document.getElementById('themeBtnText');
      const resetBtn = document.getElementById('resetBtn');
      const clock = document.getElementById('desktopClock');

      // 读取 URL 参数中的主题
      const params = new URLSearchParams(window.location.search);
      let initialTheme = params.get('theme') || 'dark';
      let initialLang = params.get('lang') || localStorage.getItem('nookclip-lang') || 'zh-Hans';
      // 实时时钟更新
      function updateClock() {
        const now = new Date();
        const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        const dayStr = days[now.getDay()];
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        if (clock) clock.textContent = `${dayStr} ${h}:${m}`;
      }
      updateClock();
      setInterval(updateClock, 30000);

      // 实例化独立测试台
      const prototype = new window.NookClipPrototype('#standalonePrototypeMount', {
        theme: initialTheme,
        lang: initialLang,
        standalone: true,
        onThemeChange: (newTheme) => {
          applyTheme(newTheme);
        }
      });

      function applyTheme(theme) {
        const isDark = theme === 'dark';
        desktop.classList.toggle('is-light', !isDark);
        desktop.setAttribute('data-theme', theme);
        if (themeBtnText) {
          themeBtnText.textContent = isDark ? '切换浅色' : '切换深色';
        }
      }

      applyTheme(initialTheme);

      if (themeBtn) {
        themeBtn.addEventListener('click', () => {
          const current = desktop.classList.contains('is-light') ? 'light' : 'dark';
          const next = current === 'dark' ? 'light' : 'dark';
          prototype.setTheme(next);
          applyTheme(next);
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          prototype.resetDemoData();
        });
      }

      // 自动聚焦窗口以确保键盘事件直接生效
      const win = document.getElementById('nookWindow');
      if (win) {
        win.focus();
      }
    });
  </script>
</body>
</html>
